# Pensado para o Coolify: as variáveis SERVICE_* são geradas automaticamente no deploy
# (senhas do Postgres e do app, segredo de sessão, domínio do web). Veja os valores
# na aba Environment Variables do recurso. Para rodar localmente, defina-as no .env.
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: posterai
      POSTGRES_PASSWORD: ${SERVICE_PASSWORD_POSTGRES}
      POSTGRES_DB: posterai
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U posterai"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    environment:
      DATABASE_URL: postgresql://posterai:${SERVICE_PASSWORD_POSTGRES}@postgres:5432/posterai
      REDIS_URL: redis://redis:6379
      STORAGE_DIR: /storage
      APP_PASSWORD: ${SERVICE_PASSWORD_APP}
      SESSION_SECRET: ${SERVICE_PASSWORD_64_SESSION}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      LLM_PROVIDER: ${LLM_PROVIDER:-openai}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      SERVICE_FQDN_WEB_3000: ""
    volumes:
      - storage:/storage
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/api/health').then(r=>process.exit(r.status<500?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5

  worker:
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    environment:
      DATABASE_URL: postgresql://posterai:${SERVICE_PASSWORD_POSTGRES}@postgres:5432/posterai
      REDIS_URL: redis://redis:6379
      STORAGE_DIR: /storage
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      LLM_PROVIDER: ${LLM_PROVIDER:-openai}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    volumes:
      - storage:/storage

volumes:
  pgdata:
  redisdata:
  storage:
